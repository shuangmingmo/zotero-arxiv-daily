name: Send emails daily

# Started every morning at 09:17 Europe/Zurich by a Google Cloud Scheduler job that calls
# GitHub's workflow_dispatch API. GitHub's own `schedule:` trigger silently stopped firing twice.
on:
  workflow_dispatch:

concurrency:
  group: zotero-arxiv-daily
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # healthchecks.io ping URL; it emails an alert when a run fails or no run finishes on time.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        shell: bash
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml

          echo "Use custom config:"
          cat config/custom.yaml

          for attempt in 1 2 3; do
            echo "Run attempt $attempt/3"

            if uv run src/zotero_arxiv_daily/main.py; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 600))
            fi
          done

          exit 1

      - name: Report success to healthchecks.io
        if: success() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL" || echo "healthchecks.io ping failed"

      - name: Report failure to healthchecks.io
        if: (failure() || cancelled()) && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail" || echo "healthchecks.io ping failed"
